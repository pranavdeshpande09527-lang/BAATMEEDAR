name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$response" -ne 200 ] && [ "$response" -ne 201 ]; then
            echo "::error::Render deploy hook returned HTTP $response"
            exit 1
          fi
          echo "Deploy hook triggered successfully (HTTP $response)"

      - name: Wait for deployment to stabilize
        run: sleep 120

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run post-deploy smoke tests
        working-directory: server
        env:
          DEPLOY_BASE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: node scripts/post-deploy.js
