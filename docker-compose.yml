services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baatmeedar-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/baatmeedar_dev
      - SUPABASE_URL=${SUPABASE_URL:-https://example.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-mock-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-mock-service-role-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CORS_ORIGINS=http://localhost:5500,http://localhost:3000
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - baatmeedar-net

  postgres:
    image: postgres:16-alpine
    container_name: baatmeedar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baatmeedar_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - baatmeedar-net

volumes:
  pgdata:

networks:
  baatmeedar-net:
    driver: bridge
