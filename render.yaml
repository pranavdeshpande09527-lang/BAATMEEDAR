# Render Blueprint — Baatmeedar Backend Web Service
services:
  - type: web
    name: baatmeedar-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - Dockerfile
        - .dockerignore
    preDeployCommand: node server/src/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://baatmeedar.vercel.app,https://baatmeedar.com,http://localhost:5500,http://localhost:3000,http://localhost:5000,http://127.0.0.1:5500,http://127.0.0.1:5000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

